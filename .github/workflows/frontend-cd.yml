name: Frontend CD

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy_sha:
        description: Exact tested commit SHA to deploy.
        required: true
        type: string
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_call' && inputs.deploy_sha || github.sha }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.deploy_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify production API URL
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Repository variable VITE_API_URL must be configured before deployment."
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_MODE: demo
        run: npm run build

      - name: Deploy built frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true
