name: Backend CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    name: Build and deploy backend image
    runs-on: ubuntu-latest
    env:
      ACR_NAME: acrjobfitamjadneu
      ACR_LOGIN_SERVER: acrjobfitamjadneu.azurecr.io
      IMAGE_REPOSITORY: jobfit-backend
      RESOURCE_GROUP: rg-jobfit-demo-neu
      CONTAINER_APP: ca-jobfit-api-neu
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI support
        shell: bash
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Build immutable backend image
        shell: bash
        run: |
          set -euo pipefail
          image="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "$image" .

      - name: Authenticate Docker to Azure Container Registry
        shell: bash
        run: az acr login --name "$ACR_NAME" --only-show-errors

      - name: Push immutable backend image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${GITHUB_SHA}"

      - name: Deploy exact image to Container App
        shell: bash
        run: |
          set -euo pipefail
          image="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$image" \
            --only-show-errors

      - name: Verify deployed revision image and provisioning
        shell: bash
        run: |
          set -euo pipefail
          revision="$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName \
            --output tsv)"
          test -n "$revision"
          echo "Waiting for revision: $revision"

          expected_image="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          revision_image="$(az containerapp revision show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$revision" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          if [ "$revision_image" != "$expected_image" ]; then
            echo "Revision $revision image mismatch: expected $expected_image, got ${revision_image:-<empty>}."
            exit 1
          fi
          echo "Revision image matches the expected immutable deployment image."

          for attempt in {1..30}; do
            running_state="$(az containerapp revision show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$revision" \
              --query properties.runningState \
              --output tsv 2>/dev/null || true)"
            provisioning_state="$(az containerapp revision show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$revision" \
              --query properties.provisioningState \
              --output tsv 2>/dev/null || true)"
            echo "Attempt $attempt/30: running=$running_state provisioning=$provisioning_state"

            case "$provisioning_state:$running_state" in
              *Failed*|*failed*|*Degraded*|*degraded*|*Error*|*error*)
                echo "Container App revision entered a failure state."
                exit 1
                ;;
            esac

            if [ "$provisioning_state" = "Provisioned" ]; then
              echo "Revision is provisioned; endpoint smoke checks will verify runtime availability."
              exit 0
            fi
            sleep 10
          done

          echo "Container App revision did not become provisioned within five minutes."
          exit 1

      - name: Verify health and readiness endpoints
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          test -n "$fqdn"
          base_url="https://${fqdn}"
          echo "Verifying Container App endpoint: $fqdn"

          for endpoint in health ready; do
            for attempt in {1..12}; do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 40 "$base_url/$endpoint" || true)"
              echo "$endpoint attempt $attempt/12: HTTP $status"
              if [ "$status" = "200" ]; then
                break
              fi
              if [ "$attempt" = "12" ]; then
                echo "$endpoint did not return HTTP 200 within the retry window."
                exit 1
              fi
              sleep 10
            done
          done
