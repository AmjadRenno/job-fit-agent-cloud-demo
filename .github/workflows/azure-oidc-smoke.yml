name: Azure OIDC smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure-oidc-smoke:
    name: Read-only Azure OIDC verification
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure account context
        shell: bash
        run: |
          az account show \
            --query '{subscriptionName:name, environmentName:environmentName, userType:user.type}' \
            --output json

      - name: Verify read-only resource access
        shell: bash
        run: |
          az group show \
            --name rg-jobfit-demo-neu \
            --query '{name:name, location:location, provisioningState:properties.provisioningState}' \
            --output json
          az resource show \
            --resource-group rg-jobfit-demo-neu \
            --resource-type Microsoft.App/containerApps \
            --name ca-jobfit-api-neu \
            --query '{name:name, location:location, type:type, provisioningState:properties.provisioningState}' \
            --output json
